name: Commit Stage
on: push

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: synbat-d/catalog-service
  VERSION: latest

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4 # Updated to v4

      - name: Set up JDK
        uses: actions/setup-java@v4 # Updated to v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Code Vulnerability scanning
        uses: anchore/scan-action@v3
        id: scan
        with:
          path: "${{github.workspace}}"
          fail-build: false
          severity-cutoff: high

      - name: Upload vulnerability report
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      - name: Build, unit tests and integration tests
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Validate Kubernetes manifests
        uses: stefanprodan/kube-tools@v1
        with:
          # We only need the command block for kubeconform
          command: |
            kubeconform -strict -summary -kubernetes-version 1.24.3 k8s/

  package:
    name: Package and Publish
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build container image
        run: |
          chmod +x gradlew
          ./gradlew bootBuildImage --imageName=${{ env.REGISTRY}}/${{ env.IMAGE_NAME}}:${{ env.VERSION}}

      - name: OCI image vulnerability scanning
        uses: anchore/scan-action@v3
        id: scan
        with:
          image: ${{ env.REGISTRY}}/${{ env.IMAGE_NAME}}:${{ env.VERSION}}
          fail-build: false
          severity-cutoff: 'high'

      - name: Upload vulnerability report
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3 # Updated to v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish container image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}:${{ env.VERSION}}